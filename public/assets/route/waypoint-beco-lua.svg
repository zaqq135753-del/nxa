<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="twilight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A6984" />
      <stop offset="100%" stop-color="#F2C19B" />
    </linearGradient>
    <linearGradient id="sand3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8CEAF" />
      <stop offset="100%" stop-color="#CA9F76" />
    </linearGradient>
  </defs>
  <rect width="600" height="220" fill="url(#twilight)" />
  <rect y="210" width="600" height="190" fill="url(#sand3)" />

  <!-- Casinha Colorida 1 (Azul Caraíva à esquerda) -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="160" height="130" fill="#246083" stroke="#18435C" stroke-width="2" />
    <!-- Telhado colonial -->
    <path d="M -15,0 L 80,-40 L 175,0 Z" fill="#B3543A" stroke="#873924" stroke-width="2" />
    <!-- Janelas brancas com veneziana -->
    <rect x="25" y="30" width="35" height="45" rx="3" fill="#FFF" />
    <rect x="95" y="30" width="35" height="45" rx="3" fill="#FFF" />
    <!-- Porta rústica de madeira -->
    <rect x="60" y="70" width="35" height="60" fill="#E6953B" stroke="#B86F22" stroke-width="2" />
  </g>

  <!-- Casinha Colorida 2 (Amarela Ocre à direita) -->
  <g transform="translate(390, 130)">
    <rect x="0" y="0" width="170" height="140" fill="#E5AC42" stroke="#B88528" stroke-width="2" />
    <!-- Telhado colonial -->
    <path d="M -15,0 L 85,-45 L 185,0 Z" fill="#B3543A" stroke="#873924" stroke-width="2" />
    <rect x="30" y="35" width="40" height="50" rx="3" fill="#2E6B56" stroke="#FFF" stroke-width="2" />
    <rect x="100" y="35" width="40" height="50" rx="3" fill="#2E6B56" stroke="#FFF" stroke-width="2" />
    <rect x="65" y="75" width="38" height="65" fill="#2E6B56" />
  </g>

  <!-- Varal com Lâmpadas / Cordão de Luzes do Beco -->
  <path d="M 120,110 Q 300,160 460,110" stroke="#4A3B32" stroke-width="2" fill="none" />
  <circle cx="210" cy="138" r="6" fill="#FFE57F" filter="drop-shadow(0 0 4px #FFD54F)" />
  <circle cx="295" cy="148" r="6" fill="#FFE57F" filter="drop-shadow(0 0 4px #FFD54F)" />
  <circle cx="380" cy="136" r="6" fill="#FFE57F" filter="drop-shadow(0 0 4px #FFD54F)" />

  <!-- Pegadas na areia (Direção a seguir) -->
  <g fill="#A67B52" opacity="0.6">
    <ellipse cx="280" cy="300" rx="5" ry="9" transform="rotate(-15 280 300)" />
    <ellipse cx="320" cy="330" rx="5" ry="9" transform="rotate(15 320 330)" />
    <ellipse cx="290" cy="360" rx="5" ry="9" transform="rotate(-10 290 360)" />
  </g>

  <!-- Indicador -->
  <rect x="20" y="20" width="240" height="52" rx="10" fill="rgba(28, 63, 56, 0.88)" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFF">PONTO 3: BECO DA LUA</text>
  <text x="35" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#E28444">Casas Coloridas & Bifurcação Central</text>
</svg>
