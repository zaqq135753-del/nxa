<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80B5D0" />
      <stop offset="100%" stop-color="#E2EDF4" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#356653" />
      <stop offset="100%" stop-color="#234638" />
    </linearGradient>
    <linearGradient id="sandBank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EADDCB" />
      <stop offset="100%" stop-color="#D1BAA0" />
    </linearGradient>
  </defs>
  <rect width="600" height="230" fill="url(#skyGrad)" />
  <rect y="220" width="600" height="180" fill="url(#waterGrad)" />
  <!-- Margem de Areia / Barranco de Desembarque -->
  <path d="M 0,300 Q 250,260 450,270 L 600,280 L 600,400 L 0,400 Z" fill="url(#sandBank)" />
  
  <!-- Canoa tradicional no rio -->
  <g transform="translate(180, 260)">
    <path d="M 0,15 Q 60,35 140,15 Q 70,5 0,15 Z" fill="#8B4513" />
    <path d="M 10,14 Q 65,30 130,14 Z" fill="#D2691E" />
    <line x1="40" y1="-10" x2="80" y2="30" stroke="#5C3B1E" stroke-width="3" />
  </g>
  <!-- Segunda canoa atracada na areia -->
  <g transform="translate(360, 280)">
    <path d="M 0,10 Q 70,32 150,10 Q 75,0 0,10 Z" fill="#1C3F38" />
    <path d="M 12,9 Q 72,25 138,9 Z" fill="#2E6B56" />
  </g>

  <!-- Barqueiro Pataxó com remo -->
  <circle cx="210" cy="245" r="8" fill="#5C3B1E" />
  <path d="M 210,253 L 210,275 L 205,285" stroke="#5C3B1E" stroke-width="3" fill="none" />
  <rect x="204" y="253" width="12" height="18" rx="3" fill="#E28444" />

  <!-- Árvores e vegetação no topo do barranco -->
  <ellipse cx="80" cy="240" rx="90" ry="40" fill="#2D5A3F" opacity="0.9" />
  <ellipse cx="500" cy="230" rx="120" ry="50" fill="#244B34" opacity="0.9" />

  <!-- Indicador de Ponto de Referência -->
  <rect x="20" y="20" width="220" height="52" rx="10" fill="rgba(28, 63, 56, 0.88)" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFF">PONTO 1: O DESEMBARQUE</text>
  <text x="35" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#E28444">Barranco do Rio Caraíva</text>
</svg>
