<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B9CD3" />
      <stop offset="100%" stop-color="#C2E2F5" />
    </linearGradient>
    <linearGradient id="sandSunny" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E3CF" />
      <stop offset="100%" stop-color="#DECBAD" />
    </linearGradient>
  </defs>
  <rect width="600" height="230" fill="url(#skyBlue)" />
  <rect y="220" width="600" height="180" fill="url(#sandSunny)" />

  <!-- Coqueiros ao fundo da Igrejinha -->
  <g transform="translate(130, 230)">
    <path d="M 0,0 Q -20,-90 -10,-170" stroke="#7A5636" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="-10" cy="-170" r="50" fill="#2E6B48" opacity="0.8" />
  </g>
  <g transform="translate(470, 230)">
    <path d="M 0,0 Q 30,-80 20,-160" stroke="#7A5636" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="20" cy="-160" r="55" fill="#3B7D57" opacity="0.8" />
  </g>

  <!-- Igrejinha Branca de São Sebastião -->
  <g transform="translate(210, 110)">
    <!-- Corpo da Igreja -->
    <rect x="0" y="40" width="180" height="130" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="2" />
    <!-- Frontão triangular clássico -->
    <polygon points="0,40 90,-20 180,40" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="2" />
    <!-- Cruz no topo -->
    <line x1="90" y1="-20" x2="90" y2="-45" stroke="#1E3A8A" stroke-width="4" />
    <line x1="80" y1="-35" x2="100" y2="-35" stroke="#1E3A8A" stroke-width="4" />
    <!-- Sino / Torre -->
    <rect x="75" y="0" width="30" height="30" rx="15" fill="#E5E7EB" stroke="#1E3A8A" stroke-width="2" />
    <circle cx="90" cy="15" r="5" fill="#D97706" />
    <!-- Porta Principal Azul Celeste -->
    <path d="M 68,170 L 68,105 Q 90,90 112,105 L 112,170 Z" fill="#1D4ED8" stroke="#172554" stroke-width="2" />
    <!-- Janelas Coloniais Azuis -->
    <rect x="25" y="70" width="24" height="40" rx="12" fill="#1D4ED8" stroke="#172554" stroke-width="1.5" />
    <rect x="131" y="70" width="24" height="40" rx="12" fill="#1D4ED8" stroke="#172554" stroke-width="1.5" />
  </g>

  <!-- Campo verde rústico ao redor -->
  <path d="M 120,230 Q 300,240 480,230" stroke="#4D7C0F" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Indicador -->
  <rect x="20" y="20" width="240" height="52" rx="10" fill="rgba(28, 63, 56, 0.88)" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFF">PONTO 4: A IGREJINHA</text>
  <text x="35" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#E28444">Igreja de São Sebastião & Gramado</text>
</svg>
