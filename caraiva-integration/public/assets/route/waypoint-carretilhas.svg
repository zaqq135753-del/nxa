<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BC7E0" />
      <stop offset="100%" stop-color="#E8F1F5" />
    </linearGradient>
    <linearGradient id="sand2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECD8C2" />
      <stop offset="100%" stop-color="#DEBE9C" />
    </linearGradient>
  </defs>
  <rect width="600" height="200" fill="url(#sky2)" />
  <rect y="180" width="600" height="220" fill="url(#sand2)" />

  <!-- Amendoeira Centenária (Folhas avermelhadas e verdes) -->
  <g transform="translate(140, 220)">
    <path d="M 0,0 Q 20,-80 15,-150 L -20,-150 Q -10,-60 -30,0 Z" fill="#5C3B1E" />
    <circle cx="20" cy="-150" r="80" fill="#2E5A44" opacity="0.85" />
    <circle cx="-40" cy="-140" r="70" fill="#B44C34" opacity="0.8" />
    <circle cx="0" cy="-180" r="75" fill="#3B7056" opacity="0.9" />
  </g>

  <!-- Carrinhos de Carretilha de Madeira na Areia -->
  <g transform="translate(320, 260)">
    <!-- Carrinho 1 -->
    <rect x="0" y="0" width="90" height="36" rx="4" fill="#8B5A2B" stroke="#5C3B1E" stroke-width="2" />
    <circle cx="20" cy="45" r="16" fill="#3E2723" stroke="#212121" stroke-width="3" />
    <circle cx="70" cy="45" r="16" fill="#3E2723" stroke="#212121" stroke-width="3" />
    <!-- Malas coloridas empilhadas -->
    <rect x="10" y="-28" width="40" height="26" rx="3" fill="#C35228" />
    <rect x="35" y="-46" width="36" height="22" rx="3" fill="#1E7B4F" />
    <!-- Braços do carrinho -->
    <line x1="90" y1="12" x2="135" y2="-10" stroke="#5C3B1E" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Carretilheiro Sorridente de Chapéu de Palha -->
  <g transform="translate(455, 225)">
    <circle cx="0" cy="0" r="9" fill="#8D5524" />
    <!-- Chapéu de palha -->
    <ellipse cx="0" cy="-6" rx="18" ry="5" fill="#E6C894" stroke="#C29D75" stroke-width="1.5" />
    <path d="M 0,10 L 0,38 L -6,60" stroke="#5C3B1E" stroke-width="3" fill="none" />
    <rect x="-7" y="10" width="14" height="26" rx="3" fill="#FFF" stroke="#E2E8F0" />
  </g>

  <!-- Placa Rústica de Madeira -->
  <g transform="translate(40, 160)">
    <rect x="18" y="30" width="8" height="90" fill="#5C3B1E" />
    <rect x="0" y="0" width="120" height="38" rx="4" fill="#A0522D" stroke="#5C3B1E" stroke-width="2" />
    <text x="60" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFF" text-anchor="middle">BEM-VINDO À VILA</text>
    <text x="60" y="30" font-family="system-ui, sans-serif" font-size="8" fill="#FFD700" text-anchor="middle">CARAÍVA · BAHIA</text>
  </g>

  <!-- Indicador -->
  <rect x="20" y="20" width="240" height="52" rx="10" fill="rgba(28, 63, 56, 0.88)" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFF">PONTO 2: CARRETILHEIROS</text>
  <text x="35" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#E28444">A Amendoeira & Transporte de Malas</text>
</svg>
