<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="warmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="sandFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E8DC" />
      <stop offset="100%" stop-color="#DEC9B3" />
    </linearGradient>
  </defs>
  <rect width="600" height="210" fill="url(#warmSky)" />
  <rect y="200" width="600" height="200" fill="url(#sandFront)" />

  <!-- Fachada e Muro Rústico de Madeira e Taipa do Caramuru Hostel -->
  <g transform="translate(60, 100)">
    <!-- Casa Principal do Hostel -->
    <rect x="0" y="30" width="480" height="150" fill="#E28444" stroke="#9A3412" stroke-width="2" />
    <!-- Telhado em Taubilha / Telhas rústicas -->
    <path d="M -20,30 L 240,-20 L 500,30 Z" fill="#78350F" stroke="#451A03" stroke-width="2" />
    <!-- Varanda em Deck de Madeira -->
    <rect x="30" y="100" width="420" height="80" fill="#B45309" opacity="0.3" />
    <!-- Cerca e portão rústico aberto convidando a entrar -->
    <rect x="180" y="100" width="120" height="90" fill="none" stroke="#78350F" stroke-width="4" />
    <path d="M 180,100 L 240,70 L 300,100" stroke="#78350F" stroke-width="4" fill="none" />
    <!-- Placa de Identificação com Destaque -->
    <rect x="190" y="45" width="100" height="34" rx="6" fill="#1C3F38" stroke="#FFF" stroke-width="2" />
    <text x="240" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">CARAMURU</text>
    <text x="240" y="73" font-family="system-ui, sans-serif" font-size="8" fill="#E28444" text-anchor="middle">HOSTEL &amp; SUÍTES</text>
  </g>

  <!-- Bougainvillea Florida Vermelha/Pink caindo sobre o portão -->
  <g fill="#DB2777" opacity="0.95">
    <circle cx="210" cy="180" r="14" />
    <circle cx="230" cy="170" r="18" />
    <circle cx="250" cy="175" r="16" />
    <circle cx="270" cy="165" r="20" />
    <circle cx="290" cy="178" r="15" />
    <circle cx="310" cy="190" r="14" />
    <circle cx="240" cy="190" r="12" fill="#BE185D" />
    <circle cx="280" cy="190" r="12" fill="#9D174D" />
  </g>

  <!-- Tapete de areia limpa e luz de boas-vindas -->
  <ellipse cx="300" cy="310" rx="140" ry="40" fill="#EAD5BF" opacity="0.6" />
  <text x="300" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1C3F38" text-anchor="middle">✨ VOCÊ CHEGOU! SEJA BEM-VINDO</text>

  <!-- Indicador -->
  <rect x="20" y="20" width="260" height="52" rx="10" fill="rgba(195, 82, 40, 0.95)" />
  <text x="35" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFF">PONTO 5: CHEGADA AO HOSTEL</text>
  <text x="35" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#FEF3C7">Caramuru Hostel &amp; Suítes (Portão Principal)</text>
</svg>
